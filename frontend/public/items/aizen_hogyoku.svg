<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="voidBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="40%" stop-color="#0F0F23" />
      <stop offset="80%" stop-color="#050512" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="hogyokuCrystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E7FF" />
      <stop offset="25%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="75%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <radialGradient id="corePulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#A5B4FC" />
      <stop offset="60%" stop-color="#6366F1" />
      <stop offset="90%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0" />
    </radialGradient>
    <filter id="cosmicGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#voidBg)" stroke="#818CF8" stroke-width="4" />
  <rect x="12" y="12" width="488" height="488" rx="84" fill="none" stroke="#C7D2FE" stroke-opacity="0.3" stroke-width="2" />

  <!-- Concentric Reiatsu Ripple Waves -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="14 10" opacity="0.3" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="10 8" opacity="0.45" />
  <circle cx="256" cy="256" r="100" fill="none" stroke="#C7D2FE" stroke-width="2.5" opacity="0.6" filter="url(#cosmicGlow)" />

  <!-- Floating Crystalline Cluster Silhouette -->
  <g transform="translate(60, 60) scale(0.76)" filter="url(#cosmicGlow)">
    <path d="m263.563 19.063-53.875 59.562v90.063l-34.75-60.188-35.563-17.594-9.344 43.53 48.376 83.783-19.97-5.345-28.75 10.5 19.658 23.5 30.28 8.125-59.155 15.844-23.407 27.97 34.25 12.498 66.875-17.937-27.875 48.28 5.562 62.72 33.813-15.72v33.126l46.812 66.626 46.78-66.625v-72.81l21.626 68.092 35.875 27.344 13.564-43.03-32.688-102.97 42.875 11.5 26.876-13.78-17.78-20.22-64.595-17.312-.092-.25 82.25-22.03 21.125-24.064-31.97-16.406-73.656 19.75 39-67.594-3.562-55.25-58.844 18.97V78.624l-39.717-59.563zm-5.72 109.562 22.438 115.03 39.876 12.032-39.875 12.032-22.436 115.03-22.375-114.53-41.595-12.533 41.594-12.53 22.374-114.532z" fill="url(#hogyokuCrystal)" stroke="#E0E7FF" stroke-width="2.5" />
  </g>

  <!-- Intense Cosmic Pulsing Singularity Core -->
  <circle cx="256" cy="256" r="50" fill="url(#corePulse)" filter="url(#cosmicGlow)" />
  <circle cx="256" cy="256" r="18" fill="#FFFFFF" />

  <!-- Starlight Flares -->
  <path d="M256 160 L 256 352 M 160 256 L 352 256" stroke="#FFFFFF" stroke-width="3" filter="url(#cosmicGlow)" />
