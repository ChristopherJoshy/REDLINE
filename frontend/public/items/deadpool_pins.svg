<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="dpBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#450A0A" />
      <stop offset="50%" stop-color="#260404" />
      <stop offset="85%" stop-color="#120101" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="gold24k" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#dpBg)" stroke="#EF4444" stroke-width="4" />
  <rect x="12" y="12" width="488" height="488" rx="84" fill="none" stroke="#F87171" stroke-opacity="0.3" stroke-width="2" />

  <!-- Massive 24K Golden Pull Ring -->
  <g filter="url(#goldShine)">
    <circle cx="210" cy="220" r="130" fill="none" stroke="url(#gold24k)" stroke-width="32" />
    <!-- Specular Highlight on Ring -->
    <path d="M120 160 A 130 130 0 0 1 270 95" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.8" />

    <!-- Split Cotter Pin Shaft -->
    <path d="M330 220 L 440 220 L 450 200 L 450 240 Z" fill="url(#gold24k)" stroke="#78350F" stroke-width="4" />
    <rect x="330" y="210" width="100" height="20" rx="4" fill="url(#gold24k)" stroke="#78350F" stroke-width="3" />
  </g>

  <!-- Deadpool Mask Charm Hanging on Chain -->
  <g transform="translate(290, 270)" filter="url(#goldShine)">
    <!-- Small Chain Links -->
    <ellipse cx="20" cy="20" rx="6" ry="12" fill="none" stroke="url(#gold24k)" stroke-width="5" />
    <ellipse cx="20" cy="42" rx="6" ry="12" fill="none" stroke="url(#gold24k)" stroke-width="5" />

    <!-- Round Deadpool Face Charm -->
    <g transform="translate(20, 110)">
      <circle cx="0" cy="0" r="65" fill="#DC2626" stroke="url(#gold24k)" stroke-width="8" />
      <line x1="0" y1="-65" x2="0" y2="65" stroke="#18181B" stroke-width="8" />
      <!-- Black Eye Patches -->
      <ellipse cx="-28" cy="0" rx="24" ry="34" fill="#18181B" />
      <ellipse cx="28" cy="0" rx="24" ry="34" fill="#18181B" />
      <!-- White Squint Eyes -->
      <path d="M-36 -8 Q -28 -2 -18 -8 Q -28 -14 -36 -8 Z" fill="#FFFFFF" />
      <path d="M36 -8 Q 28 -2 18 -8 Q 28 -14 36 -8 Z" fill="#FFFFFF" />
    </g>
  </g>
</svg>