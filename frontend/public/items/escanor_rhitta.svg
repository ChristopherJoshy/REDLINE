<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="solarBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="40%" stop-color="#260C03" />
      <stop offset="80%" stop-color="#140602" />
      <stop offset="100%" stop-color="#050201" />
    </radialGradient>
    <linearGradient id="sunGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="25%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="75%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <radialGradient id="solarFlare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="90%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0" />
    </radialGradient>
    <filter id="solarGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#solarBg)" stroke="#F59E0B" stroke-width="4" />
  <rect x="12" y="12" width="488" height="488" rx="84" fill="none" stroke="#FDE047" stroke-opacity="0.3" stroke-width="2" />

