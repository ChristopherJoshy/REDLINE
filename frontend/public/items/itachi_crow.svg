<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="itachiBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="40%" stop-color="#0F0C29" />
      <stop offset="80%" stop-color="#060414" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="featherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="30%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#18181B" />
      <stop offset="85%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="sharinganRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="80%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#450A0A" />
    </radialGradient>
    <filter id="amaterasuGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#itachiBg)" stroke="#EF4444" stroke-width="4" />
  <rect x="12" y="12" width="488" height="488" rx="84" fill="none" stroke="#F87171" stroke-opacity="0.3" stroke-width="2" />

  <!-- Swirling Crows Flocking in Background -->
  <g opacity="0.25" fill="#DC2626">
    <path d="M120 120 Q 140 100 160 115 Q 140 125 120 120 Z" />
    <path d="M360 140 Q 380 120 400 135 Q 380 145 360 140 Z" />
    <path d="M380 340 Q 400 320 420 335 Q 400 345 380 340 Z" />
  </g>

  <!-- Large Iridescent Raven Feather Silhouette -->
  <g transform="translate(60, 40) rotate(-12, 200, 200) scale(0.78)" filter="url(#amaterasuGlow)">
    <path d="M470.7 20 368.2 49.81l41.5-28.09c-26.2 5.92-59.3 17.5-100.9 36.19l-67.9 70.79L265 79.25c-23.3 12.96-48 29.95-71.8 49.85l-15.8 64.3-3.4-47.6c-23.5 21.6-45.6 45.6-63.9 70.9-19.23 26.5-34.26 54.5-41.79 82.4l-28.12-18.8c2.52 23.7 10.31 44.3 23.09 63.2l-33.62-10.3c7.64 23.5 20.13 38.7 41.25 51-11.83 33.3-17.38 68.1-23.34 102.8l18.4 3.1C87.31 277.4 237.9 141.8 374 81.72l6.9 17.38c-121.7 54.5-216.3 146.5-265.8 279.1 18.1.1 35.8-2.1 52.2-6.3l4.9-60.9 13.1 55.5c10.9-4 20.9-8.8 29.8-14.4l-20.7-43.5 32.8 34.8c8-6.4 14.6-13.6 19.6-21.5 30.4-47.5 62.2-94.7 124.8-134.2l-45.7-16.2 70.1 2.1c11.4-5.8 23.4-12.9 32.5-19.6l-49.7-4 74.7-17.6c5.8-5.8 11.2-11.9 16.1-18 17.3-21.94 29-44.78 26.2-65.55-1.3-10.39-7.5-20.16-17.6-25.63-2.5-1.3-5.2-2.45-7.5-3.22z" fill="url(#featherGrad)" stroke="#4338CA" stroke-width="3" />
  </g>

  <!-- Shisui's Mangekyo Sharingan Iris Glowing at Center -->
  <g transform="translate(256, 256)" filter="url(#amaterasuGlow)">
    <circle cx="0" cy="0" r="54" fill="url(#sharinganRed)" stroke="#18181B" stroke-width="5" />
    <circle cx="0" cy="0" r="14" fill="#000000" />

    <!-- 4-Pinwheel Shisui Mangekyo Blades -->
    <path d="M0 0 C 18 -12, 38 -28, 44 -4 C 34 -4, 20 -2, 0 0 Z" fill="#000000" transform="rotate(0)" /><path d="M0 0 C 18 -12, 38 -28, 44 -4 C 34 -4, 20 -2, 0 0 Z" fill="#000000" transform="rotate(90)" /><path d="M0 0 C 18 -12, 38 -28, 44 -4 C 34 -4, 20 -2, 0 0 Z" fill="#000000" transform="rotate(180)" /><path d="M0 0 C 18 -12, 38 -28, 44 -4 C 34 -4, 20 -2, 0 0 Z" fill="#000000" transform="rotate(270)" />
  </g>

  <!-- Wisps of Black Flame (Amaterasu) Curling Up -->
  <path d="M220 380 Q 200 340 230 320 Q 210 300 240 280" fill="none" stroke="#000000" stroke-width="5" filter="url(#amaterasuGlow)" opacity="0.8" />
  <path d="M280 390 Q 310 350 280 330 Q 300 310 270 290" fill="none" stroke="#000000" stroke-width="4" filter="url(#amaterasuGlow)" opacity="0.8" />
</svg>