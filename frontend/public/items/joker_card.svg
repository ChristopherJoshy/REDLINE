    </g>

    <!-- Acid Burn Splatter in Corner -->
    <path d="M136 80 Q 180 90 190 140 Q 150 170 136 120 Z" fill="url(#acidGreen)" opacity="0.75" />
    <circle cx="165" cy="115" r="8" fill="#FACC15" />
    <circle cx="180" cy="130" r="5" fill="#FACC15" />
  </g>
</svg>