<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="jokerBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2E1065" />
      <stop offset="50%" stop-color="#1E1B4B" />
      <stop offset="85%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cardParchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="50%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>
    <linearGradient id="acidGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="60%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="jokerPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="60%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#6B21A8" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#jokerBg)" stroke="#9333EA" stroke-width="4" />
  <rect x="12" y="12" width="488" height="488" rx="84" fill="none" stroke="#C084FC" stroke-opacity="0.3" stroke-width="2" />

  <!-- Shadowed Playing Card Tilt -->
  <g transform="rotate(-6, 256, 256)">
    <!-- Card Back Shadow -->
    <rect x="136" y="80" width="240" height="352" rx="20" fill="#09090B" opacity="0.6" transform="translate(10, 15)" />
    <!-- Card Base -->
    <rect x="136" y="80" width="240" height="352" rx="20" fill="url(#cardParchment)" stroke="#7E22CE" stroke-width="5" />
    <rect x="148" y="92" width="216" height="328" rx="14" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="8 6" />

    <!-- Joker Corner Badges -->
    <text x="160" y="125" font-size="28" font-family="sans-serif" font-weight="900" fill="#9333EA">J</text>
    <text x="160" y="145" font-size="16" font-family="sans-serif" font-weight="900" fill="#22C55E">★</text>
    <text x="352" y="395" font-size="28" font-family="sans-serif" font-weight="900" fill="#9333EA" transform="rotate(180, 352, 395)">J</text>
    <text x="352" y="415" font-size="16" font-family="sans-serif" font-weight="900" fill="#22C55E" transform="rotate(180, 352, 395)">★</text>

