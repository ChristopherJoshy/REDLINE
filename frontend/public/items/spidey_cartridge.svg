<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="spideyBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#020617" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>
    <linearGradient id="chromeCylinder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="25%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="85%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="starkRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="40%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="fluidGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="cyanNeon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Plate -->
  <rect width="512" height="512" rx="96" fill="url(#spideyBg)" stroke="#0284C7" stroke-width="4" />
  <rect x="12" y="12" width="488" height="488" rx="84" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="2" />

  <!-- Background Web Pattern -->
  <g opacity="0.18" stroke="#38BDF8" stroke-width="1.5">
    <line x1="256" y1="256" x2="60" y2="60" />
    <line x1="256" y1="256" x2="452" y2="60" />
    <line x1="256" y1="256" x2="60" y2="452" />
    <line x1="256" y1="256" x2="452" y2="452" />
    <line x1="256" y1="256" x2="256" y2="40" />
    <line x1="256" y1="256" x2="256" y2="472" />
    <line x1="256" y1="256" x2="40" y2="256" />
    <line x1="256" y1="256" x2="472" y2="256" />
    <polygon points="256,120 352,160 392,256 352,352 256,392 160,352 120,256 160,160" fill="none" />
    <polygon points="256,170 316,196 342,256 316,316 256,342 196,316 170,256 196,196" fill="none" />
  </g>

  <!-- Cartridge Main Body -->
  <!-- Top Nozzle & Valve -->
  <rect x="236" y="50" width="40" height="30" rx="4" fill="url(#chromeCylinder)" stroke="#0F172A" stroke-width="3" />
  <rect x="246" y="40" width="20" height="15" rx="3" fill="#38BDF8" filter="url(#cyanNeon)" />

  <!-- Stark Collar (Red) -->
  <rect x="180" y="80" width="152" height="44" rx="8" fill="url(#starkRed)" stroke="#7F1D1D" stroke-width="4" />
  <circle cx="200" cy="102" r="5" fill="#F8FAFC" />
  <circle cx="312" cy="102" r="5" fill="#F8FAFC" />
  <rect x="220" y="94" width="72" height="16" rx="4" fill="#1E293B" />
  <text x="256" y="106" font-size="10" font-family="monospace" fill="#38BDF8" font-weight="bold" text-anchor="middle">STARK-73</text>

  <!-- Glass Fluid Chamber -->
  <rect x="190" y="124" width="132" height="260" rx="16" fill="#0369A1" stroke="url(#chromeCylinder)" stroke-width="8" />
  <!-- Glowing Web Fluid Core -->
  <rect x="204" y="140" width="104" height="230" rx="10" fill="url(#fluidGlow)" filter="url(#cyanNeon)" />

  <!-- Measurement Hash Marks -->
  <g stroke="#F0FDF4" stroke-width="2" opacity="0.8">
    <line x1="290" y1="170" x2="304" y2="170" />
    <line x1="294" y1="200" x2="304" y2="200" />
    <line x1="290" y1="230" x2="304" y2="230" />
    <line x1="294" y1="260" x2="304" y2="260" />
    <line x1="290" y1="290" x2="304" y2="290" />
    <line x1="294" y1="320" x2="304" y2="320" />
    <line x1="290" y1="350" x2="304" y2="350" />
  </g>

  <!-- Fluid Specular Glass Reflection -->
  <rect x="210" y="145" width="12" height="215" rx="6" fill="#FFFFFF" opacity="0.65" />

  <!-- Fluid Bubbles -->
  <circle cx="235" cy="310" r="6" fill="#E0F2FE" opacity="0.8" />
  <circle cx="260" cy="270" r="8" fill="#E0F2FE" opacity="0.75" />
  <circle cx="245" cy="210" r="5" fill="#E0F2FE" opacity="0.85" />
  <circle cx="270" cy="180" r="4" fill="#E0F2FE" opacity="0.9" />

  <!-- Bottom Pressure Base -->
  <rect x="180" y="384" width="152" height="48" rx="10" fill="url(#starkRed)" stroke="#7F1D1D" stroke-width="4" />
  <rect x="216" y="432" width="80" height="24" rx="6" fill="url(#chromeCylinder)" stroke="#0F172A" stroke-width="3" />
</svg>